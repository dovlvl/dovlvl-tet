name: Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and required Ruff
        shell: pwsh
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['ruff']['required-version'])"
          python -m pip install "ruff$version"
      - name: Check formatting
        run: python -m ruff format --check src tests tools
      - name: Check lint baseline and offline tests
        run: python tools/ci_checks.py
